Reports non-ASCII characters in a structured header (<code>From</code>, <code>To</code>, <code>Cc</code>, <code>Subject</code>, etc.) that are not wrapped in an RFC 2047 encoded-word.
<p>A quick-fix replaces the header value with <code>=?UTF-8?B?…?=</code> (Base64-encoded UTF-8).</p>
