<body>
Reports that a MIME part's declared <code>charset=</code> cannot decode the actual body bytes — e.g. <code>charset=us-ascii</code> with a UTF-8 multi-byte sequence.
<p>A quick-fix replaces the declared charset with the first one (UTF-8, ISO-8859-1, windows-1252) that decodes the body cleanly.</p>
