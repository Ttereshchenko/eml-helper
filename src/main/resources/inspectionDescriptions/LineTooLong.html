Reports lines that exceed 998 octets, the maximum length permitted by RFC 5322 §2.1.1. Long lines are routinely rejected or silently mangled by SMTP relays.
<p>For header lines a quick-fix folds the line at column 78 by inserting a CRLF followed by a single space, per RFC 5322 §2.2.3.</p>
