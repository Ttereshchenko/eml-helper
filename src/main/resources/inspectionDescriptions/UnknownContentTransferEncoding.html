<body>
Reports a <code>Content-Transfer-Encoding</code> header whose value is not one of the five canonical RFC 2045 §6.1 encodings: <code>7bit</code>, <code>8bit</code>, <code>binary</code>, <code>quoted-printable</code>, <code>base64</code>.
<p>A quick-fix replaces the value with <code>8bit</code>, which is the safest fallback for typical bodies.</p>
