name: PR Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check-commits:
    name: Single commit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/check_pr')
      )
    steps:
      - name: Enforce squash
        uses: actions/github-script@v9
        with:
          script: |
            let count;
            if (context.eventName === 'pull_request') {
              count = context.payload.pull_request.commits;
            } else {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              count = pr.commits;
            }
            if (count !== 1) {
              core.setFailed(`PR has ${count} commits — squash to 1 before merging.`);
            }

  resolve:
    name: Resolve SHA and PR number
    needs: check-commits
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/check_pr')
      )
    outputs:
      sha: ${{ steps.pick-sha.outputs.sha }}
      pr-number: ${{ steps.pick-sha.outputs.pr-number }}
    steps:
      - id: pick-sha
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('sha', context.payload.pull_request.head.sha);
              core.setOutput('pr-number', context.payload.pull_request.number);
            } else {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              core.setOutput('sha', pr.head.sha);
              core.setOutput('pr-number', String(context.payload.issue.number));
            }

  check:
    name: Check (tests · Checkstyle · Spotless · JaCoCo)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run check
        run: ./gradlew check

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14

      - name: Upload test and Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            build/reports/tests/test/
            build/reports/checkstyle/
          retention-days: 14

  verify-plugin:
    name: Verify Plugin (2025.3 · 2026.1)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run verifyPlugin
        run: ./gradlew verifyPlugin

      - name: Upload plugin verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          retention-days: 14
