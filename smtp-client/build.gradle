plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.ttereshchenko'
version = rootProject.version

java {
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        // Stable JPMS name so modular consumers do not depend on the jar filename.
        attributes 'Automatic-Module-Name': 'com.github.ttereshchenko.mailkit.smtp'
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'mailkit-smtp-client'
            pom {
                name = 'MailKit SMTP Client'
                description = 'Standalone SMTP/ESMTP client: STARTTLS and implicit TLS, SASL auth ' +
                        '(PLAIN, LOGIN, CRAM-MD5, DIGEST-MD5, SCRAM, XOAUTH2, OAUTHBEARER, EXTERNAL), ' +
                        'PIPELINING, CHUNKING, PRDR, DSN, SIZE, 8BITMIME, SMTPUTF8, PROXY protocol, XCLIENT.'
                url = 'https://github.com/ttereshchenko/mailkit'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    integrationTestImplementation 'org.testcontainers:testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestRuntimeOnly 'org.slf4j:slf4j-simple:2.0.18'
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs SMTP integration tests against real servers via Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn integrationTest
}
