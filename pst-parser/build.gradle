plugins {
    id 'java-library'
}

// Standalone-library packaging: ship sources and javadoc jars alongside the binary jar.
java {
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.encoding = 'UTF-8'
    // Keep doclint's html/reference checks but allow package-private types referenced from public
    // Javadoc to be summarized without @param/@return on every accessor.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Give the artifact a stable identity on the JDK 21 modulepath and a non-bare manifest. A fixed
// Automatic-Module-Name avoids the unstable name the JVM would otherwise derive from the jar filename;
// Implementation-Title/Version make the jar self-describing (version tracks the plugin release).
jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.github.ttereshchenko.mailkit.pst',
                'Implementation-Title': 'pst-parser',
                'Implementation-Version': rootProject.version
        )
    }
}
