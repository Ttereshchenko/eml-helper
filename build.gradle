import org.jetbrains.changelog.Changelog
import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.models.ProductRelease

plugins {
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.diffplug.spotless' version '8.7.0'
    id 'checkstyle'
    id 'jacoco'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Werror'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
        jacoco {
            includeNoLocationClasses = true
            excludes = ['jdk.internal.*']
        }
        testLogging {
            events 'failed', 'standardError'
            exceptionFormat = 'full'
            showStackTraces = true
            showCauses = true
            showExceptions = true
        }
    }

    jacocoTestReport {
        dependsOn test
        // The IntelliJ Platform plugin instruments the root module's classes, so coverage must be
        // matched against the instrumented output there. The pure-Java subprojects have no such
        // directory — pointing them at it produced empty reports (audit F13) — so they keep the
        // default main-source class directories.
        if (project == rootProject) {
            classDirectories.setFrom(files('build/instrumented/instrumentCode'))
        }
        reports {
            xml.required = true
            html.required = true
        }
    }

    checkstyle {
        toolVersion = '11.1.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = false
        maxWarnings = 0
        showViolations = true
    }

    afterEvaluate {
        checkstyle {
            def sets = [sourceSets.main, sourceSets.test]
            if (sourceSets.findByName('integrationTest')) {
                sets.add(sourceSets.integrationTest)
            }
            sourceSets = sets
        }
    }

    spotless {
        java {
            target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/integrationTest/java/**/*.java'
            palantirJavaFormat('2.90.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

group = 'com.github.ttereshchenko'
version = pluginVersion

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

tasks.named('processResources').configure {
    exclude '**/.DS_Store'
}

dependencies {
    intellijPlatform {
        intellijIdea('2026.1')
        testFramework(TestFrameworkType.Platform.INSTANCE)
        bundledPlugin('Git4Idea')
    }
    implementation 'org.apache.poi:poi-scratchpad:5.5.1'
    implementation project(':smtp-client')
    implementation project(':pst-parser')

    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

changelog {
    version = pluginVersion
}

intellijPlatform {
    pluginConfiguration {
        name = 'MailKit'
        changeNotes = provider {
            changelog.renderItem(
                changelog.getOrNull(pluginVersion) ?: changelog.getUnreleased(),
                Changelog.OutputType.HTML
            )
        }
    }
    pluginVerification {
        ides {
            select { filter ->
                filter.types = [IntelliJPlatformType.IntellijIdea]
                filter.channels = [ProductRelease.Channel.RELEASE]
                filter.sinceBuild = '261'
                filter.untilBuild = '261.*'
            }
        }
    }
    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }
}
