import org.jetbrains.changelog.Changelog
import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'org.jetbrains.intellij.platform' version '2.16.0'
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.diffplug.spotless' version '8.4.0'
    id 'java'
    id 'checkstyle'
    id 'jacoco'
}

java {
    // IntelliJ Platform 2026.1 (since-build=261) runs on JBR 21. Toolchain must match so the
    // verifier accepts targetCompatibility=21 and the produced bytecode is loadable by the IDE.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'com.github.ttereshchenko'
version = pluginVersion

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea('2026.1')
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    jacoco {
        // IntelliJ test runner uses a custom classloader (PathClassLoader) whose classes can lack
        // a CodeSource; without this flag JaCoCo silently skips instrumenting them.
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

jacocoTestReport {
    dependsOn test
    // IntelliJ Platform Gradle Plugin rewrites bytecode (NotNull/Nullable instrumentation) into
    // build/instrumented/instrumentCode; the runtime loads those, so the report must analyse them
    // too — otherwise probe ids mismatch and coverage shows as 0.
    classDirectories.setFrom(files('build/instrumented/instrumentCode'))
    reports {
        xml.required = true
        html.required = true
    }
}

changelog {
    version = pluginVersion
}

intellijPlatform {
    pluginConfiguration {
        name = 'MailKit'
        changeNotes = provider {
            changelog.renderItem(
                changelog.getOrNull(pluginVersion) ?: changelog.getUnreleased(),
                Changelog.OutputType.HTML
            )
        }
    }
    pluginVerification {
        ides {
            create(IntelliJPlatformType.IntellijIdea, '2025.3')
            create(IntelliJPlatformType.IntellijIdea, '2026.1')
        }
    }
    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }
}

checkstyle {
    toolVersion = '11.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
    showViolations = true
    sourceSets = [sourceSets.main, sourceSets.test]
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        palantirJavaFormat('2.90.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
